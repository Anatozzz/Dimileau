<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Merci - Dimileau</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .bg-hero {
      background: radial-gradient(circle at 20% 30%, rgba(34,197,94,0.15), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(59,130,246,0.15), transparent 40%),
                  linear-gradient(to bottom right, #f8fafc, #ffffff);
    }

    .glass {
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.75);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-up {
      animation: fadeUp 0.8s ease forwards;
    }
  </style>
</head>

<body class="bg-hero min-h-screen flex items-center justify-center px-6">

  <div class="relative max-w-2xl w-full glass rounded-3xl shadow-2xl p-12 text-center fade-up">

    <!-- Decorative glow -->
    <div class="absolute -top-20 -right-20 w-60 h-60 bg-green-400/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-20 -left-20 w-60 h-60 bg-blue-400/20 rounded-full blur-3xl"></div>

    <!-- Icon -->
    <div class="relative z-10 w-24 h-24 bg-gradient-to-br from-green-500 to-emerald-400 rounded-full flex items-center justify-center mx-auto mb-8 shadow-lg shadow-green-500/30">
      <i data-lucide="check" class="w-12 h-12 text-white"></i>
    </div>

    <!-- Title -->
    <h1 class="relative z-10 text-4xl lg:text-5xl font-extrabold text-slate-900 mb-6 leading-tight">
      Merci pour votre demande 🎉
    </h1>

    <!-- Subtitle -->
    <p class="relative z-10 text-lg text-slate-600 mb-10 leading-relaxed max-w-xl mx-auto">
      Votre diagnostic personnalisé est en cours d’analyse.
      <br class="hidden sm:block">
      Notre équipe vous contacte sous <span class="font-bold text-slate-900">24 heures</span>.
    </p>

    <!-- Timeline -->
    <div class="relative z-10 flex justify-center gap-8 mb-12 text-sm text-slate-600">
      <div class="flex flex-col items-center">
        <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center mb-2">
          <i data-lucide="mail" class="w-4 h-4"></i>
        </div>
        Demande reçue
      </div>

      <div class="flex flex-col items-center">
        <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center mb-2">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        Analyse en cours
      </div>

      <div class="flex flex-col items-center">
        <div class="w-8 h-8 rounded-full bg-slate-300 text-white flex items-center justify-center mb-2">
          <i data-lucide="phone" class="w-4 h-4"></i>
        </div>
        Contact sous 24h
      </div>
    </div>

    <!-- Buttons -->
    <div class="relative z-10 flex flex-col gap-5">

      <!-- Instagram CTA -->
      <a href="https://www.instagram.com/dimil_eau/"
         target="_blank"
         class="inline-flex items-center justify-center gap-3 px-8 py-4 text-white font-bold text-lg rounded-full bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 hover:scale-105 transition transform shadow-xl">
        <i data-lucide="instagram" class="w-5 h-5"></i>
        Suivre Dimileau sur Instagram
      </a>

      <!-- Return Home -->
      <a href="https://dimileau.netlify.app"
         class="inline-flex items-center justify-center gap-3 px-8 py-4 bg-slate-900 text-white font-bold text-lg rounded-full hover:bg-slate-800 transition shadow-lg">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        Retour à l’accueil
      </a>

    </div>

    <!-- Footer small note -->
    <p class="relative z-10 text-xs text-slate-400 mt-10">
      Dimileau • Innovation éco-responsable
    </p>

  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
