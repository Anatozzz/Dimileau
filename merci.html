<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Merci - Dimileau</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-6">

  <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-10 text-center">

    <div class="w-20 h-20 bg-brand-green rounded-full flex items-center justify-center mx-auto mb-6">
      <i data-lucide="check" class="w-10 h-10 text-white"></i>
    </div>

    <h1 class="text-3xl font-extrabold text-slate-900 mb-4">
      Merci pour votre demande 🎉
    </h1>

    <p class="text-slate-600 mb-8 leading-relaxed">
      Votre diagnostic personnalisé est en cours d’analyse.  
      Notre équipe vous contacte sous 24h.
    </p>

    <div class="flex flex-col gap-4">

      <a href="https://www.instagram.com/dimil_eau/" 
         target="_blank"
         class="inline-flex items-center justify-center gap-2 px-6 py-4 bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 text-white font-bold rounded-full hover:opacity-90 transition">
        <i data-lucide="instagram" class="w-5 h-5"></i>
        Suivre Dimileau sur Instagram
      </a>

      <a href="index.html"
         class="inline-flex items-center justify-center gap-2 px-6 py-4 bg-slate-900 text-white font-bold rounded-full hover:bg-slate-800 transition">
        Retour à l'accueil
      </a>

    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
